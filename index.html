<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影片商品連結</title>
<style>
  :root { --bg: #fafafa; --card: #fff; --text: #1a1a1a; --muted: #666; --accent: #ee4d2d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --card: #1c1c1c; --text: #eee; --muted: #999; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  input { width: 100%; padding: 12px; font-size: 1rem; border-radius: 10px;
          border: 1px solid var(--muted); background: var(--card); color: var(--text); }
  ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
  a.item { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 12px;
           background: var(--card); color: inherit; text-decoration: none; }
  .no { min-width: 3.2em; font-weight: 700; color: var(--accent); }
  img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
  .name { flex: 1; line-height: 1.4; }
</style>
</head>
<body>
<h1>影片商品連結</h1>
<p>本日選物。此頁含分潤連結。</p>
<input id="q" inputmode="numeric" placeholder="輸入影片上的編號，例如 12">
<ul id="list">

  <li data-no="2">
    <a class="item" href="https://s.shopee.tw/7Aea92A5DS" rel="nofollow sponsored">
      <span class="no">#2</span>
      
      <span class="name">寵物玩具 發聲寵物玩具 耐咬寵物玩具 藏食寵物玩具 貓狗寵物玩具 解悶寵物玩具 防拆寵物玩具 自嗨寵物玩具 漏食寵物玩具</span>
    </a>
  </li>

</ul>
<script>
  const q = document.getElementById("q");
  const filter = () => {
    const v = q.value.trim();
    for (const [index, li] of [...document.querySelectorAll("#list li")].entries()) {
      li.hidden = v ? li.dataset.no !== v : index >= 60;
    }
  };
  q.addEventListener("input", filter);
  const hash = location.hash.slice(1);
  if (/^\d+$/.test(hash)) { q.value = hash; filter(); }
</script>
</body>
</html>
