<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>影片商品連結</title>
<style>
  :root { --bg: #fafafa; --card: #fff; --text: #1a1a1a; --muted: #666; --accent: #ee4d2d; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111; --card: #1c1c1c; --text: #eee; --muted: #999; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 16px; background: var(--bg); color: var(--text);
         font-family: system-ui, -apple-system, "PingFang TC", "Noto Sans TC", sans-serif; }
  h1 { font-size: 1.25rem; margin: 0 0 12px; }
  input { width: 100%; padding: 12px; font-size: 1rem; border-radius: 10px;
          border: 1px solid var(--muted); background: var(--card); color: var(--text); }
  ul { list-style: none; padding: 0; margin: 12px 0 0; display: grid; gap: 10px; }
  a.item { display: flex; gap: 12px; align-items: center; padding: 10px; border-radius: 12px;
           background: var(--card); color: inherit; text-decoration: none; }
  .no { min-width: 3.2em; font-weight: 700; color: var(--accent); }
  img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
  .name { flex: 1; line-height: 1.4; }
</style>
</head>
<body>
<h1>影片商品連結</h1>
<input id="q" inputmode="numeric" placeholder="輸入影片上的編號，例如 12">
<ul id="list">

</ul>
<script>
  const q = document.getElementById("q");
  q.addEventListener("input", () => {
    const v = q.value.trim();
    for (const li of document.querySelectorAll("#list li")) {
      li.hidden = v !== "" && li.dataset.no !== v;
    }
  });
</script>
</body>
</html>
